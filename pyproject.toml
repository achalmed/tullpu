# pyproject.toml — el paquete de Python de Tullpu (el editor de fotos): dependencias y extras
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tullpu"
version = "0.1.0"
description = "Tullpu: el editor de fotos de la plataforma Qillqa (capas con miniPaint y el revelado con la plantilla de la marca), que funciona dentro de Qillqa o solo con el anfitrión mínimo de Tiqsi."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["tiqsi", "ruray", "fastapi>=0.110", "pydantic-settings>=2", "PyJWT>=2.8", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
sola = ["uvicorn[standard]>=0.30"]
pruebas = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["tullpu"]
